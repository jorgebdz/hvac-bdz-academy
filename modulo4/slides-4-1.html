<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diapositivas 4.1 | HVAC BDZ Academy</title><style>body{margin:0;background:#08243b;color:#fff;font-family:Arial,sans-serif}.top,.ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;background:#0b3c5d}button,a{cursor:pointer;background:#f28c28;color:#08243b;text-decoration:none;border:0;border-radius:8px;padding:11px 16px;font-weight:800}.slide{min-height:60vh;background:#fff;color:#113751;border-top:10px solid #f28c28;max-width:1100px;margin:30px auto;padding:5vw;border-radius:12px;display:flex;flex-direction:column;justify-content:center}.k{font-size:16px;font-weight:800;color:#cc741c}h1{font-size:clamp(29px,4vw,54px)}p{font-size:clamp(19px,2.4vw,30px);line-height:1.55}.hint{border-left:5px solid #f28c28;background:#fff6ec;padding:15px;margin-top:24px;font-size:18px}.foot{font-size:14px;margin-top:35px;color:#6a7885}@media(max-width:650px){.slide{margin:10px;padding:26px;min-height:62vh}.top,.ctrl{flex-wrap:wrap}}</style></head><body><div class="top"><strong>HVAC BDZ ACADEMY · MÓDULO 4 · SESIÓN 4.1</strong><a href="sesion-4-1.html">Volver a la sesión</a></div><article class="slide"><div class="k" id="k"></div><h1 id="t"></h1><p id="b"></p><div class="hint">Actividad del participante: comprueben este criterio directamente con el archivo de AutoCAD y la documentación del proyecto.</div><div class="foot">Material de continuidad basado en reportes de clase · no reemplaza el video ni el archivo DWG</div></article><div class="ctrl"><button id="prev">← Anterior</button><strong id="count"></strong><button id="next">Siguiente →</button></div><script>const S=[["Inicio · Módulo 4","Hoy ustedes consolidarán el diseño que empezaron en la sesión anterior. Su fuente principal es el archivo AutoCAD con el sembrado real."],["Lo que ya existe","Cuentan con un plano arquitectónico de cinco espacios, selección Xpress Rev. 01 y un primer recorrido de tuberías."],["Producto de la sesión","Al terminar, entregarán una copia del DWG revisada, tabla de seis equipos, matriz de pendientes y evidencia de validación."],["Recuperación de AutoCAD","Abran el DWG guardado en la clase 3.2. Confirmen la revisión y eviten reconstruir desde cero el sembrado."],["Planta y equipos","Identifiquen ubicación real de cada evaporadora y de la condensadora en el archivo original; no usen posiciones esquemáticas como evidencia."],["Selección confirmada","RXMQ6BVM ×1; FXAQ20AVM ×1; FXAQ32AVM ×1; FXAQ40AVM ×2; FXAQ50AVM ×1, según reporte Xpress Rev. 01."],["Dirección","FXAQ40AVM. Carga total reportada: 10,271 BTU/h. Comprueben acceso de mantenimiento y trayectoria de refrigerante."],["Sala de juntas","FXAQ50AVM. Carga total: 14,152 BTU/h. Consideren ruido, ubicación del usuario y acceso de servicio."],["Oficina operativa","FXAQ40AVM. Carga total: 9,913 BTU/h. Revisen el sembrado con la distribución de puestos."],["Recepción","FXAQ32AVM. Carga total: 7,909 BTU/h. Comprueben orientación Oeste y trayectoria de refrigerante."],["Archivo / Impresión","FXAQ20AVM. Carga total: 4,964 BTU/h. Las cargas internas no se deducen únicamente del área."],["Condensadora","RXMQ6BVM. Confirmen ubicación real, claros de servicio, descarga de aire, soporte y acceso."],["Trazado real en AutoCAD","Mantengan rutas, ramales y codos tal como se trabajaron; el detalle final se validará contra el video/DWG."],["Capas del proyecto","Organicen equipos, tuberías, derivaciones, arquitectura, cotas y notas mediante capas identificables."],["Medición de tramos","Verifiquen cada polilínea con propiedades de AutoCAD. Registren tramos, unidades, fuente y condición medida."],["Derivaciones","Identifiquen cada branch o derivación en el DWG y revisen especificaciones del fabricante antes de fijar su posición."],["Codos y accesorios","No infieran cantidades de una imagen esquemática; cuenten los cambios de dirección del trazado real."],["Chequeo de interferencias","Analicen estructura, plafón, tránsito, mobiliario, drenajes y acceso al equipo."],["Drenajes de condensados","Definan origen, recorrido, pendiente y descarga. Si no se han medido, regístrenlos como pendientes técnicos."],["Eléctrico y controles","Ubicación de alimentación, interconexión y controles requiere coordinación con planos y manuales."],["Temperatura de diseño","Ficha M2: 24 °C / 50 % HR. Reporte Xpress: 22 °C / 50 % HR. Documenten y resuelvan la discrepancia."],["Capacidad y combinación","Confirmen capacidad disponible, simultaneidad, relación de conexión y límites reales según el modelo exacto."],["Evidencia de tuberías","Reporte Xpress muestra cantidades de diámetro y longitudes; contrasten con la medición real del DWG."],["Matriz de revisión","Para cada equipo, registren espacio, modelo, ubicación, recorrido, longitud, codos y pendientes."],["Práctica por parejas","Comparen el DWG con el reporte. Señalen tres datos confirmados y tres que aún requieren verificación."],["Discusión de hallazgos","Expliquen discrepancias sin corregir arbitrariamente la carga o mover equipos para simplificar el plano."],["Control de revisiones","Guarden copia identificada: proyecto, revisión, fecha y responsable. Preserven la versión anterior."],["Lista de cotejo","Confirmen seis equipos, modelos correctos, trayectorias verificadas, unidades, evidencia y pendientes trazables."],["Cierre formativo","Cada participante defenderá una decisión de ubicación o recorrido utilizando criterios y evidencia."],["Entrega y continuidad","Dejen el archivo listo para enlazar ventilación, redes auxiliares y cuantificación durante las siguientes clases."]];let i=0;function show(){document.getElementById('k').textContent='SESIÓN 4.1 · DISEÑO HVAC';document.getElementById('t').textContent=S[i][0];document.getElementById('b').textContent=S[i][1];document.getElementById('count').textContent=(i+1)+' / '+S.length}document.getElementById('prev').onclick=()=>{i=Math.max(0,i-1);show()};document.getElementById('next').onclick=()=>{i=Math.min(S.length-1,i+1);show()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});show()</script></body></html>
