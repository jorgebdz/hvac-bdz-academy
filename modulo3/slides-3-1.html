<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diapositivas 3.1 | HVAC BDZ Academy</title><style>
:root{--navy:#0B3C5D;--blue:#166D9A;--orange:#F28C28;--green:#18A058;--ink:#1F2933;--muted:#687789;--line:#D9E2EC;--bg:#eaf0f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);overflow:hidden}
.top{height:52px;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);position:fixed;inset:0 0 auto 0;z-index:20}
.top a,.top button{border:1px solid #b9d7e5;background:#fff;color:var(--navy);font-weight:800;border-radius:999px;padding:8px 13px;text-decoration:none;cursor:pointer}.top .accent{background:var(--orange);border-color:var(--orange);color:#111}.counter{margin-left:auto;font-weight:800;color:var(--muted)}
.stage{height:100vh;padding:68px 18px 20px;display:flex;align-items:center;justify-content:center}
.slide{width:min(94vw,1280px);aspect-ratio:16/9;background:#fff;border-radius:18px;box-shadow:0 12px 36px rgba(15,39,59,.16);position:relative;overflow:hidden;padding:5.2% 6%;display:none}
.slide.active{display:flex;flex-direction:column;justify-content:center}
.slide:before{content:"";position:absolute;left:0;top:0;width:100%;height:7px;background:var(--orange)}
.kicker{position:absolute;left:6%;top:5%;font-size:14px;font-weight:900;color:var(--blue);letter-spacing:.04em;text-transform:uppercase}.num{position:absolute;right:4%;bottom:4%;font-weight:900;color:#91a0ad}
h1,h2{color:var(--navy);margin:0 0 22px}h1{font-size:clamp(34px,4.6vw,66px)}h2{font-size:clamp(30px,4vw,58px)}p{font-size:clamp(20px,2.15vw,32px);line-height:1.45;margin:0}.sub{color:var(--muted);font-size:clamp(17px,1.7vw,25px)}
.flow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:28px}.pill{background:#eef7fb;border:2px solid #b9d7e5;border-radius:16px;padding:18px 22px;font-weight:900;color:var(--navy);font-size:clamp(15px,1.5vw,22px)}.arr{font-size:30px;color:var(--orange);font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:22px}.card{background:#f7fafc;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:14px;padding:18px;font-size:clamp(16px,1.55vw,23px);line-height:1.35}.card.orange{border-left-color:var(--orange);background:#fff8ed}.card.green{border-left-color:var(--green);background:#edf9f1}
.plan{width:100%;max-width:760px;margin:22px auto 0;display:grid;grid-template-columns:3fr 5fr 4fr;grid-template-rows:4fr 2fr 4fr;height:300px;border:3px solid var(--navy)}.room{border:1px solid var(--navy);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;color:var(--navy);font-size:18px;padding:8px}.r1{grid-column:1;grid-row:3}.r2{grid-column:1;grid-row:2}.r3{grid-column:2;grid-row:1}.r4{grid-column:2;grid-row:3}.r5{grid-column:3;grid-row:2/4}.circ{grid-column:1;grid-row:1;background:#f2f4f6}.circ2{grid-column:2/4;grid-row:2;background:#f2f4f6}
.diagram{margin:24px auto 0;max-width:850px}.wall{height:16px;background:var(--navy);margin:20px 0}.door{display:inline-block;width:140px;height:70px;border-left:5px solid var(--orange);border-top:5px solid var(--orange);border-radius:70px 0 0 0}.north{font-size:92px;color:var(--navy);font-weight:900;text-align:center;margin-top:16px}.warning{background:#fff8ed;border-left:8px solid var(--orange);padding:20px;border-radius:14px;font-size:clamp(18px,1.7vw,25px);margin-top:22px}.check{columns:2;column-gap:32px;margin-top:22px;font-size:clamp(16px,1.55vw,22px);line-height:1.7}.check div:before{content:"☐ ";font-weight:900;color:var(--green)}
@media(max-width:760px){body{overflow:auto}.top{position:sticky}.stage{height:auto;min-height:calc(100vh - 52px);padding:10px}.slide{display:flex!important;aspect-ratio:auto;min-height:70vh;margin:12px 0;padding:55px 24px 42px}.stage{display:block}.grid{grid-template-columns:1fr}.plan{height:240px}.counter,.top button{display:none}}
</style></head><body><div class="top"><a href="sesion-3-1.html">← Sesión 3.1</a><button id="prev">◀ Anterior</button><button class="accent" id="next">Siguiente ▶</button><button id="full">Pantalla completa</button><span class="counter" id="counter"></span></div><main class="stage" id="stage"></main><script>
const S=[["Módulo 3 · Selección y diseño HVAC","Sesión 3.1 · AutoCAD + LG LATS CAD","cover"],["Bienvenida","Hoy ustedes convierten una base arquitectónica en una base CAD confiable para diseño HVAC.","standard"],["Técnica de integración · Del número al sistema","CARGA TÉRMICA → PLANO → BASE CAD → LATS CAD → SELECCIÓN → DISEÑO","flow"],["Alcance de la sesión","Hoy no seleccionaremos equipos todavía. Primero dejaremos una base geométrica limpia, escalada y trazable.","standard"],["Objetivo de aprendizaje","Preparar y validar la base arquitectónica del caso Oficina Administrativa BDZ para iniciar el flujo de LATS CAD con al menos 80% de cumplimiento.","standard"],["Contrato de aprendizaje","Trabajen sobre una copia · no alteren geometría para facilitar el software · documenten cada decisión.","standard"],["¿Cómo se evaluará?","Diagnóstica sin calificación · práctica con lista de cotejo 10 criterios · verificación final 5 reactivos · evidencia CAD.","eval"],["Diagnóstico rápido","¿Qué información de M2 debe mantenerse idéntica cuando pasamos del cálculo de carga al diseño?","question"],["Ruta de la sesión","RECUPERAR → PREPARAR → VERIFICAR → INTEGRAR → EVIDENCIAR","flow"],["Lo que M2 nos entrega","Carga por espacio · condiciones de diseño · orientación · ocupación · envolvente · ventilación · horario.","standard"],["Preflight","Antes de iniciar: AutoCAD 2025 abre · LATS Hub detecta CAD · archivo base abre · unidades conocidas.","check"],["Manual y Help","Usen el manual para el método del curso y el Help de LATS para funciones específicas del software.","standard"],["Caso oficial M3","Continuamos exactamente con Oficina Administrativa BDZ. No cambiaremos dimensiones ni espacios.","plan"],["Los cinco espacios","Recepción 12 m² · Dirección 16 m² · Operativa 20 m² · Sala 24 m² · Archivo 6 m²","plan"],["Regla de compatibilidad","Una base CAD útil para diseño debe conservar geometría, unidades, orientación, aberturas y trazabilidad.","standard"],["Paso 1 · Crear copia de trabajo","No trabajen sobre el archivo maestro. Guarden una copia identificada para la sesión.","practice"],["Paso 2 · Unidades y escala","Verifiquen milímetros y midan una dimensión conocida: huella general 12,000 × 10,000 mm.","practice"],["Paso 3 · Identificar los cinco espacios","Comprueben que nombre, área y posición coincidan con el caso oficial.","practice"],["Paso 4 · Capas y limpieza","Separe muros, puertas, ventanas, cotas, textos y referencias. Apaguen lo innecesario; no borren el maestro.","layers"],["Paso 5 · Muros y continuidad","Revisen cierres, encuentros y huecos. Una discontinuidad puede afectar reconocimiento o trazado.","walls"],["Paso 6 · Puertas y ventanas","Conserven ubicación, ancho y sentido de apertura. Las ventanas exteriores deben mantener su orientación.","doors"],["Paso 7 · Orientación y referencia","El Norte del plano debe coincidir con la orientación utilizada en el cálculo de carga.","north"],["Paso 8 · Archivo limpio","Antes de integrar, guarden una copia limpia con sólo la información necesaria para HVAC.","practice"],["Pausa técnica","Guarden. Cerren operaciones pendientes. Verifiquen que el archivo reabre correctamente.","check"],["Puntos de control","Unidades · escala · huella · espacios · aberturas · Norte · capas · limpieza · nombre de archivo.","check"],["Energizante · Detecta el error","¿Qué error técnico observan primero: escala, geometría, orientación o capa? Justifiquen.","question"],["Preflight LATS CAD","Entren al software sólo después de validar la base. El software no corrige un plano mal preparado.","check"],["¿Qué validar antes de diseñar?","Base arquitectónica confiable · resultados M2 disponibles · criterios de selección definidos · software operativo.","standard"],["Carga calculada ≠ selección final","La carga térmica expresa necesidad. La selección final requerirá capacidad real y condiciones de operación.","compare"],["Práctica individual","Preparen su copia de la Oficina Administrativa BDZ aplicando los ocho pasos.","practice"],["Evaluación formativa","Demuestren: unidades, escala, geometría, espacios, ventanas, orientación, capas, limpieza, trazabilidad y explicación del flujo.","eval"],["Guardar evidencia","Conserven archivo CAD + captura de dimensión conocida + captura de vista limpia + checklist.","eval"],["Cuando algo no coincide","Detengan el flujo. Comparen contra el plano oficial. Corrijan la base; no compensen el error en el software.","warning"],["AutoCAD + LATS CAD","AutoCAD organiza la geometría. LATS CAD usa esa base para desarrollar el sistema. Ambos requieren criterio técnico.","compare"],["Producto de la sesión","Base CAD validada y lista para selección/diseño, con evidencia suficiente para revisión.","eval"],["Verificación final","Respondan cinco reactivos de criterio técnico. Meta: 4/5.","eval"],["Cierre 1–2–1","1 aprendizaje clave · 2 controles que repetirán · 1 riesgo que evitarán.","question"],["Tarea","Dejen su base CAD lista para la siguiente sesión y documenten cualquier incidencia de LATS CAD con captura completa.","practice"],["Cierre de 3.1","Una base confiable evita errores que después parecen problemas de selección o software.","cover"]]; const stage=document.getElementById('stage'); let idx=0;
function extra(kind){
 if(kind==='flow')return '<div class="flow"><span class="pill">DATO</span><span class="arr">→</span><span class="pill">PLANO</span><span class="arr">→</span><span class="pill">SOFTWARE</span><span class="arr">→</span><span class="pill">VALIDACIÓN</span></div>';
 if(kind==='plan')return '<div class="plan"><div class="room circ">Circulación</div><div class="room r3">Dirección<br>16 m²</div><div class="room r2">Archivo<br>6 m²</div><div class="room circ2">Circulación</div><div class="room r1">Recepción<br>12 m²</div><div class="room r4">Operativa<br>20 m²</div><div class="room r5">Sala de Juntas<br>24 m²</div></div>';
 if(kind==='layers')return '<div class="grid"><div class="card">MUROS<br><b>Geometría base</b></div><div class="card orange">PUERTAS / VENTANAS<br><b>Aberturas</b></div><div class="card green">COTAS / TEXTOS<br><b>Referencia</b></div><div class="card">HVAC<br><b>Trabajo de diseño</b></div></div>';
 if(kind==='walls')return '<div class="diagram"><div class="wall"></div><p class="sub">Continuidad geométrica: sin huecos accidentales, duplicados ni segmentos flotantes.</p><div class="wall"></div></div>';
 if(kind==='doors')return '<div class="grid"><div class="card"><div class="door"></div><br><b>Puerta:</b> ancho y giro coherentes.</div><div class="card orange"><b>Ventana:</b><br>ubicación exterior + orientación correctas.</div></div>';
 if(kind==='north')return '<div class="north">↑ N</div><p class="sub" style="text-align:center">La orientación del plano debe coincidir con la usada en la carga térmica.</p>';
 if(kind==='check'||kind==='eval')return '<div class="check"><div>Unidades</div><div>Escala</div><div>Geometría</div><div>Espacios</div><div>Aberturas</div><div>Norte</div><div>Capas</div><div>Trazabilidad</div></div>';
 if(kind==='compare')return '<div class="grid"><div class="card">CARGA TÉRMICA<br><b>Necesidad del espacio</b></div><div class="card orange">SELECCIÓN / DISEÑO<br><b>Solución real validada</b></div></div>';
 if(kind==='warning')return '<div class="warning">No compensen en LATS CAD un error que nació en el plano.</div>';
 if(kind==='question')return '<div class="grid"><div class="card">¿Qué dato observan?</div><div class="card orange">¿Cómo lo comprueban?</div></div>';
 if(kind==='practice')return '<div class="flow"><span class="pill">USTEDES HACEN</span><span class="arr">→</span><span class="pill">VERIFICAMOS</span><span class="arr">→</span><span class="pill">CONTINUAMOS</span></div>';
 return '<div class="grid"><div class="card">Dato de entrada</div><div class="card green">Criterio técnico</div></div>';
}
S.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide';sec.innerHTML='<div class="kicker">HVAC BDZ Academy · Sesión 3.1</div><div class="num">'+(i+1)+' / '+S.length+'</div>'+(s[2]==='cover'?'<h1>'+s[0]+'</h1>':'<h2>'+s[0]+'</h2>')+'<p>'+s[1]+'</p>'+extra(s[2]);stage.appendChild(sec);});
const slides=[...document.querySelectorAll('.slide')];function show(n){idx=Math.max(0,Math.min(n,slides.length-1));slides.forEach((s,i)=>s.classList.toggle('active',i===idx));document.getElementById('counter').textContent=(idx+1)+' / '+slides.length;}show(0);
document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))show(idx+1);if(['ArrowLeft','PageUp'].includes(e.key))show(idx-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);});
</script></body></html>
