pan><span id="count"></span></div></article></main><nav><button onclick="go(-1)">← Anterior</button><button onclick="go(1)">Siguiente →</button></nav><script>const slides=[{"n":1,"title":"Módulo 3 · Selección y diseño HVAC","body":"Hoy ustedes pasan de calcular una necesidad térmica a defender una selección técnica."},{"n":2,"title":"El reto de hoy","body":"¿Qué equipo satisface la carga sin convertir la selección en una simple equivalencia de BTU/h?"},{"n":3,"title":"Conexión con M2","body":"La carga térmica validada es el punto de partida. No se modifica para que coincida con un modelo."},{"n":4,"title":"Objetivo de aprendizaje","body":"Convertir cargas validadas en una propuesta preliminar de selección HVAC y justificarla."},{"n":5,"title":"Producto de la sesión","body":"Ficha de selección preliminar por espacio + criterios de validación pendientes."},{"n":6,"title":"Diagnóstico","body":"¿Qué diferencia existe entre carga de diseño, capacidad nominal y capacidad disponible?"},{"n":7,"title":"Ruta técnica","body":"CARGA → CAPACIDAD CANDIDATA → TIPO DE UNIDAD → COMPATIBILIDAD → VALIDACIÓN."},{"n":8,"title":"Caso oficial","body":"Oficina Administrativa BDZ: cinco espacios, misma geometría y condiciones utilizadas en M2."},{"n":9,"title":"Datos que no cambian","body":"Guadalajara · 24 °C · 50% HR · 2.70 m altura libre · 0.40 m plenum."},{"n":10,"title":"Los cinco espacios","body":"Recepción, Dirección, Operativa, Sala de Juntas y Archivo/Impresión."},{"n":11,"title":"Carga ≠ equipo","body":"Una carga de 17,600 BTU/h no convierte automáticamente a 18,000 BTU/h de equipo."},{"n":12,"title":"¿Por qué?","body":"El desempeño depende de condiciones de operación, combinación, aplicación y datos del fabricante."},{"n":13,"title":"Capacidad nominal","body":"Es una referencia de clasificación; no sustituye la comprobación de capacidad en condición de diseño."},{"n":14,"title":"Capacidad disponible","body":"Es la capacidad que debemos comprobar para las condiciones reales del proyecto y la configuración elegida."},{"n":15,"title":"Sensible y latente","body":"La selección debe responder a la naturaleza de la carga, no únicamente al total."},{"n":16,"title":"Tipo de unidad interior","body":"Cassette, ducto, mural u otra solución se decide por aplicación, arquitectura, distribución y mantenimiento."},{"n":17,"title":"Plafón y espacio técnico","body":"Antes de seleccionar, comprueben altura, plenum, registros y espacio para servicio."},{"n":18,"title":"Distribución de aire","body":"Una capacidad correcta con mala distribución puede producir un espacio mal acondicionado."},{"n":19,"title":"Ubicación del usuario","body":"Eviten decisiones que provoquen tiro directo, zonas muertas o incomodidad."},{"n":20,"title":"Mantenimiento","body":"La unidad debe poder inspeccionarse, limpiarse y desmontarse sin convertir el servicio en una demolición."},{"n":21,"title":"Arquitectura","body":"Luminarias, estructura, plafón, mobiliario y estética son restricciones reales del diseño."},{"n":22,"title":"Ruido","body":"En Dirección y Sala de Juntas, el criterio acústico puede modificar una selección aparentemente correcta."},{"n":23,"title":"Ventilación","body":"La carga de ventilación y el suministro de aire exterior deben conservarse dentro de la estrategia del sistema."},{"n":24,"title":"Compatibilidad","body":"No basta que una unidad tenga la capacidad: debe pertenecer a una combinación y sistema técnicamente compatibles."},{"n":25,"title":"Relación de combinación","body":"La suma de unidades interiores y la unidad exterior se validan con las reglas del fabricante."},{"n":26,"title":"Longitudes y desniveles","body":"Tubería, separación vertical y límites del sistema pueden invalidar una selección preliminar."},{"n":27,"title":"Correcciones de capacidad","body":"Longitud, temperatura y configuración pueden modificar la capacidad efectiva disponible."},{"n":28,"title":"No sobredimensionen por reflejo","body":"Agregar capacidad sin criterio puede perjudicar control, confort, consumo y operación."},{"n":29,"title":"Tampoco subdimensionen","body":"La selección debe cubrir la carga de diseño con el margen y criterio que correspondan al sistema."},{"n":30,"title":"Demostración · Dirección","body":"Ustedes seguirán conmigo la secuencia completa: carga → candidato → tipo → restricciones → validación."},{"n":31,"title":"Paso 1 · recuperar la carga","body":"Usen el resultado validado de M2 y documenten su procedencia."},{"n":32,"title":"Paso 2 · capacidad candidata","body":"Identifiquen la clase de capacidad cercana; todavía no la declaren selección final."},{"n":33,"title":"Paso 3 · unidad interior","body":"Justifiquen el tipo de unidad con base en el espacio, no en preferencia personal."},{"n":34,"title":"Paso 4 · revisar arquitectura","body":"Comprueben plafón, distribución, mantenimiento e interferencias."},{"n":35,"title":"Paso 5 · validar fabricante","body":"Confirmen capacidades, límites y combinaciones con catálogo/software aplicable."},{"n":36,"title":"Checkpoint · Dirección","body":"¿Pueden defender la selección en 60 segundos usando datos?"},{"n":37,"title":"Práctica · Recepción","body":"Repitan la secuencia. Atención especial a orientación Oeste y condición de acceso."},{"n":38,"title":"Práctica · Operativa","body":"Relacionen ocupación, distribución del aire y patrón de uso."},{"n":39,"title":"Práctica · Sala de Juntas","body":"Revisen ocupación variable, acústica y distribución."},{"n":40,"title":"Práctica · Archivo/Impresión","body":"No confundan área pequeña con carga despreciable: revisen equipo interno y uso."},{"n":41,"title":"Error 1","body":"Elegir sólo por BTU/h nominales."},{"n":42,"title":"Error 2","body":"Cambiar la carga calculada para hacerla coincidir con un equipo."},{"n":43,"title":"Error 3","body":"Ignorar acceso de mantenimiento e interferencias."},{"n":44,"title":"Error 4","body":"Confundir selección preliminar con selección validada."},{"n":45,"title":"Evaluación formativa","body":"Entreguen una ficha: carga, capacidad candidata, tipo de unidad, 3 criterios de justificación y pendientes."},{"n":46,"title":"Criterio de logro","body":"La selección debe ser trazable, coherente con el espacio y técnicamente argumentada. Meta ≥80%."},{"n":47,"title":"Evidencia","body":"Conserven captura/archivo y anoten qué dato del fabricante falta confirmar."},{"n":48,"title":"Cierre técnico","body":"La pregunta correcta no es «¿qué equipo se parece a mi carga?», sino «¿qué solución satisface y valida esta condición de diseño?»"},{"n":49,"title":"Puente a la siguiente etapa","body":"Con selecciones justificadas podremos estructurar el sistema y llevarlo al flujo de LATS CAD."},{"n":50,"title":"Salida 3–2–1","body":"3 criterios que validarás · 2 errores que evitarás · 1 decisión que ya puedes defender."},{"n":51,"title":"Xpress 10.7.9 · Pantalla principal","body":"Identifiquen Indoor Units, Outdoor Units, Piping, Wiring, Centralized Controllers y Reports. Configuración México; refrigerante y familia de producto se validan con la versión instalada."},{"n":52,"title":"Antes de seleccionar","body":"En Indoor Units registren nombre de proyecto y cliente, país México, familia aplicable y condiciones de enfriamiento. Usen las cargas reales validadas en M2."},{"n":53,"title":"Capacidad total y sensible","body":"La pantalla muestra campos Rq TC y Rq SC (requerimientos total y sensible). Verifiquen unidades y definiciones en la ayuda del programa; no intercambien ambos valores."},{"n":54,"title":"Unidad interior · primera selección","body":"Agreguen una unidad interior para Dirección. Verifiquen FCU, capacidad, temperatura de evaporación y caudal de aire, conforme a opciones de la versión."},{"n":55,"title":"Unidad exterior · configuración","body":"En Outdoor Units seleccionen familia y configuración compatible. La suma nominal de interiores no sustituye la validación de capacidad corregida y combinación permitida."},{"n":56,"title":"Piping · comprobaciones","body":"En Piping documenten longitudes, ramales, desniveles y advertencias del programa. No inventen distancias del plano: registren como pendiente lo que aún no se midió."},{"n":57,"title":"Wiring y controles","body":"Revisen Wiring y Centralized Controllers sólo después de establecer la arquitectura del sistema; la clase no equivale a ingeniería ejecutiva de control."},{"n":58,"title":"Reports · evidencia","body":"Generen el reporte de selección disponible, guarden el archivo del proyecto y documenten advertencias o restricciones pendientes."},{"n":59,"title":"Práctica guiada · cinco espacios","body":"Completen Recepción, Dirección, Operativa, Sala de Juntas y Archivo/Impresión con sus cargas reales M2, unidad candidata y justificación."},{"n":60,"title":"Salida · evidencia verificable","body":"Entreguen matriz por espacio, captura del proyecto, advertencias de validación y explicación de una decisión de selección."}];let idx=0;function draw(){const x=slides[idx];document.getElementById('label').textContent='DIAPOSITIVA '+(idx+1);document.getElementById('title').innerHTML=x.title;document.getElementById('body').innerHTML=x.body;document.getElementById('count').textContent=(idx+1)+' / '+slides.length;}function go(n){idx=Math.max(0,Math.min(slides.length-1,idx+n));draw()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1)});draw();</script></body></html>
