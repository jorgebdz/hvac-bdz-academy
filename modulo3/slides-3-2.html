<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sesión 3.2 · Presentación técnica ilustrada | HVAC BDZ Academy</title><style>:root{--navy:#0b3c5d;--deep:#061f34;--blue:#166d9a;--orange:#f28c28;--teal:#10a4ba;--line:#d6e4ee;--muted:#476177}*{box-sizing:border-box}body{margin:0;background:#071f33;font-family:Arial,Helvetica,sans-serif;color:#15334e}.toolbar{min-height:57px;background:#082e49;display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap;color:white}.brand{margin-right:auto;font-weight:900;letter-spacing:.04em}.brand b{color:#ffa44f}.toolbar a,.toolbar button,.ctrl button{font:inherit;font-weight:800;border:0;border-radius:8px;padding:9px 14px;background:var(--orange);color:#08263d;cursor:pointer;text-decoration:none}.toolbar a{background:#d8edf5}.stage{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:16px}.slide{background:#fff;width:min(1450px,98vw);aspect-ratio:16/9;min-height:650px;max-height:calc(100vh - 144px);border-top:9px solid var(--orange);border-radius:13px;overflow:auto;padding:clamp(22px,3.2vw,46px);box-shadow:0 15px 44px #0008}.kicker{font-size:14px;font-weight:900;letter-spacing:.11em;color:var(--blue);text-transform:uppercase}.title{font-size:clamp(26px,3vw,45px);line-height:1.12;margin:12px 0 18px;color:var(--navy)}.two{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:27px;align-items:start}.lead{font-size:clamp(20px,1.65vw,27px);line-height:1.3;font-weight:800;margin:0 0 20px}.explain{font-size:clamp(18px,1.25vw,21px);line-height:1.45;color:#233c50;margin:0 0 20px}.task{background:#fff7ec;border-left:6px solid var(--orange);border-radius:8px;padding:16px;font-size:clamp(17px,1.16vw,20px);line-height:1.4}.task strong{display:block;margin-bottom:6px;color:var(--navy)}.graphic{background:linear-gradient(135deg,#eff7fa,#f9fbff);border:1px solid #cee1e9;border-radius:14px;padding:16px;min-height:340px;display:flex;flex-direction:column;justify-content:center;gap:8px}.graphic svg{width:100%;height:auto;max-height:360px}.gcaption{font-size:13px;color:#647789;text-align:center;margin-top:2px}.foot{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:#557184;border-top:1px solid #d9e6ee;margin-top:23px;padding-top:12px}.ctrl{display:flex;justify-content:center;align-items:center;gap:16px;color:white;padding:8px 12px}.ctrl span{min-width:75px;text-align:center;font-weight:800}.progress{height:4px;background:#133f5e}.progress div{height:100%;width:0;background:var(--orange);transition:width .2s}.compact{background:#e7f6fa;border-radius:9px;color:var(--navy);font-size:15px;font-weight:800;padding:10px 14px;margin-top:13px}body:fullscreen .slide{max-height:calc(100vh - 125px)}@media(max-width:850px){.stage{padding:8px;min-height:unset}.slide{width:100%;min-height:unset;aspect-ratio:auto;max-height:none;overflow:visible;padding:20px}.two{grid-template-columns:1fr;gap:12px}.graphic{min-height:180px}.graphic svg{max-height:230px}.title{font-size:27px}.lead{font-size:20px}.explain,.task{font-size:17px}.toolbar{gap:6px}.toolbar button,.toolbar a{font-size:12px}.foot{font-size:11px}.ctrl{position:sticky;bottom:0;background:#082e49}}@media print{body{background:white}.toolbar,.ctrl,.progress{display:none}.stage{padding:0}.slide{border:0;box-shadow:none;max-height:none;page-break-after:always}}</style><script src="../academy-nav.js" defer></script></head><body><div class="toolbar"><span class="brand">HVAC <b>BDZ</b> ACADEMY · M3 · 3.2</span><a href="sesion-3-2.html">Volver a la sesión</a><button id="full" type="button">Pantalla completa</button></div><div class="progress"><div id="progress"></div></div><main class="stage"><article class="slide" aria-live="polite"><div class="kicker" id="kicker"></div><h1 class="title" id="title"></h1><div class="two"><div><p class="lead" id="lead"></p><p class="explain" id="explain"></p><div class="task"><strong>Actividad para participantes</strong><span id="task"></span></div><div class="compact" id="method">PLANO → DATOS → SOFTWARE → RESULTADO → INTERPRETACIÓN</div></div><div class="graphic" id="graphic"></div></div><div class="foot"><span>HVAC BDZ Academy · Daikin Xpress 10.7.9 · 120 min</span><span id="number"></span></div></article></main><div class="ctrl"><button id="prev" type="button">← Anterior</button><span id="counter"></span><button id="next" type="button">Siguiente →</button></div><script>const slides=[{"n":1,"title":"Módulo 3 · Selección y diseño HVAC","body":"Hoy ustedes pasan de calcular una necesidad térmica a defender una selección técnica.","context":"M3 conecta la carga de M2 con decisiones de proyecto: capacidad, distribución, compatibilidad y evidencias.","exercise":"Identifiquen un dato de M2 que conservarán sin modificaciones."},{"n":2,"title":"El reto de hoy","body":"¿Qué equipo satisface la carga sin convertir la selección en una simple equivalencia de BTU/h?","context":"Una selección no se justifica porque el número comercial se parezca a la carga; debe responder a las condiciones reales.","exercise":"Expongan qué verificarían antes de elegir el equipo."},{"n":3,"title":"Conexión con M2","body":"La carga térmica validada es el punto de partida. No se modifica para que coincida con un modelo.","context":"Recuperen resultados validados de cada espacio. La matriz conserva la fuente y la fecha del cálculo.","exercise":"Localicen la evidencia de cálculo de Dirección."},{"n":4,"title":"Objetivo de aprendizaje","body":"Convertir cargas validadas en una propuesta preliminar de selección HVAC y justificarla.","context":"Al cierre podrán proponer unidades interiores y una configuración preliminar, explicando condiciones y limitaciones.","exercise":"Expresen el objetivo con sus propias palabras."},{"n":5,"title":"Producto de la sesión","body":"Ficha de selección preliminar por espacio + criterios de validación pendientes.","context":"La evidencia no es sólo una captura: incluye la carga, la unidad candidata, la capacidad verificable y los pendientes.","exercise":"Definan qué columnas tendrá su matriz."},{"n":6,"title":"Diagnóstico","body":"¿Qué diferencia existe entre carga de diseño, capacidad nominal y capacidad disponible?","context":"Carga total = componente sensible + componente latente. La capacidad nominal pertenece a condiciones de catálogo.","exercise":"Distingan los tres conceptos con un ejemplo."},{"n":7,"title":"Ruta técnica","body":"CARGA → CAPACIDAD CANDIDATA → TIPO DE UNIDAD → COMPATIBILIDAD → VALIDACIÓN.","context":"No salten de carga a modelo: analicen capacidad disponible y tipo de unidad, luego compatibilidad de la combinación.","exercise":"Reproduzcan las cinco etapas en orden."},{"n":8,"title":"Caso oficial","body":"Oficina Administrativa BDZ: cinco espacios, misma geometría y condiciones utilizadas en M2.","context":"El proyecto de Guadalajara tiene cinco espacios con usos, ventanas, orientaciones y ocupaciones distintas.","exercise":"Identifiquen por qué no conviene un único criterio para todos."},{"n":9,"title":"Datos que no cambian","body":"Guadalajara · 24 °C · 50% HR · 2.70 m altura libre · 0.40 m plenum.","context":"Las condiciones interiores y alturas se mantienen; las exteriores y factores de corrección se toman de fuentes verificables.","exercise":"Confirmen 24 °C y 50 % HR, sin inventar condiciones exteriores."},{"n":10,"title":"Los cinco espacios","body":"Recepción, Dirección, Operativa, Sala de Juntas y Archivo/Impresión.","context":"Recepción 12 m², Dirección 16 m², Operativa 20 m², Sala de Juntas 24 m² y Archivo 6 m².","exercise":"Asocien espacio con ocupación y orientación de la ficha oficial."},{"n":11,"title":"Carga ≠ equipo","body":"Una carga de 17,600 BTU/h no convierte automáticamente a 18,000 BTU/h de equipo.","context":"La comparación 17,600 vs 18,000 BTU/h es ilustrativa, no resultado del caso BDZ. La capacidad real puede diferir.","exercise":"Argumenten por qué nominal no equivale a disponible."},{"n":12,"title":"¿Por qué?","body":"El desempeño depende de condiciones de operación, combinación, aplicación y datos del fabricante.","context":"Temperatura exterior, condición interior, longitud, desnivel, familia y combinación pueden afectar selección.","exercise":"Nombren tres factores a comprobar."},{"n":13,"title":"Capacidad nominal","body":"Es una referencia de clasificación; no sustituye la comprobación de capacidad en condición de diseño.","context":"La capacidad nominal sirve para clasificar modelos. No garantiza satisfacer total y sensible en el proyecto.","exercise":"Busquen la condición de ensayo de una ficha técnica."},{"n":14,"title":"Capacidad disponible","body":"Es la capacidad que debemos comprobar para las condiciones reales del proyecto y la configuración elegida.","context":"La capacidad disponible se valida en condición de diseño mediante tablas/factores o herramienta del fabricante.","exercise":"Anoten fuente y resultado de la capacidad corregida."},{"n":15,"title":"Sensible y latente","body":"La selección debe responder a la naturaleza de la carga, no únicamente al total.","context":"La fracción sensible afecta el tratamiento de temperatura; la latente, la remoción de humedad.","exercise":"Distingan Q total y Q sensible antes de cargar Xpress."},{"n":16,"title":"Tipo de unidad interior","body":"Cassette, ducto, mural u otra solución se decide por aplicación, arquitectura, distribución y mantenimiento.","context":"Cassette, conductos y mural no son intercambiables: cada uno requiere una solución de aire y mantenimiento.","exercise":"Propongan una unidad posible y un motivo."},{"n":17,"title":"Plafón y espacio técnico","body":"Antes de seleccionar, comprueben altura, plenum, registros y espacio para servicio.","context":"El plenum del caso es 0.40 m: la altura de la unidad no es la única dimensión; cuentan tuberías, drenaje y acceso.","exercise":"Verifiquen espacio de instalación y registro."},{"n":18,"title":"Distribución de aire","body":"Una capacidad correcta con mala distribución puede producir un espacio mal acondicionado.","context":"El aire debe alcanzar la zona ocupada sin tiro directo, cortocircuito de aire ni puntos muertos.","exercise":"Dibujen recorrido de impulsión y retorno."},{"n":19,"title":"Ubicación del usuario","body":"Eviten decisiones que provoquen tiro directo, zonas muertas o incomodidad.","context":"En una oficina privada, la dirección del chorro puede condicionar la ubicación incluso si la capacidad cumple.","exercise":"Señalen un punto de incomodidad potencial."},{"n":20,"title":"Mantenimiento","body":"La unidad debe poder inspeccionarse, limpiarse y desmontarse sin convertir el servicio en una demolición.","context":"Filtros, bomba de condensados, conexiones y desmontajes necesitan claros de servicio reales.","exercise":"Marquen un acceso de inspección en planta."},{"n":21,"title":"Arquitectura","body":"Luminarias, estructura, plafón, mobiliario y estética son restricciones reales del diseño.","context":"Estructura, iluminación, plafones y mobiliario condicionan el diseño y no pueden omitirse al seleccionar.","exercise":"Identifiquen dos interferencias en el plano."},{"n":22,"title":"Ruido","body":"En Dirección y Sala de Juntas, el criterio acústico puede modificar una selección aparentemente correcta.","context":"Comprobar ruido de equipo y condiciones de operación es importante en juntas y dirección.","exercise":"Definan el espacio que requiere más cuidado acústico."},{"n":23,"title":"Ventilación","body":"La carga de ventilación y el suministro de aire exterior deben conservarse dentro de la estrategia del sistema.","context":"La carga calculada de aire exterior y su método de suministro forman parte del diseño, no desaparecen al seleccionar VRV.","exercise":"Indiquen cómo documentarán ventilación."},{"n":24,"title":"Compatibilidad","body":"No basta que una unidad tenga la capacidad: debe pertenecer a una combinación y sistema técnicamente compatibles.","context":"La unidad interior debe ser compatible con familia, refrigerante, control y unidad exterior aplicables.","exercise":"Confirmen compatibilidad en la herramienta, no por semejanza."},{"n":25,"title":"Relación de combinación","body":"La suma de unidades interiores y la unidad exterior se validan con las reglas del fabricante.","context":"El porcentaje de conexión permitido es específico de cada familia y fabricante; no usen un porcentaje universal.","exercise":"Documenten límite aplicable sin inventarlo."},{"n":26,"title":"Longitudes y desniveles","body":"Tubería, separación vertical y límites del sistema pueden invalidar una selección preliminar.","context":"Longitud equivalente, altura entre unidades y ramales requieren recorrido real del proyecto.","exercise":"Etiqueten medidas que faltan por levantar."},{"n":27,"title":"Correcciones de capacidad","body":"Longitud, temperatura y configuración pueden modificar la capacidad efectiva disponible.","context":"La capacidad corregida puede variar respecto a la nominal por combinación y condiciones del sistema.","exercise":"Registren factor/resultado y fuente al validar."},{"n":28,"title":"No sobredimensionen por reflejo","body":"Agregar capacidad sin criterio puede perjudicar control, confort, consumo y operación.","context":"Sobredimensionar sin justificación puede afectar modulación, costo, control y confort.","exercise":"Expliquen un riesgo del sobredimensionamiento."},{"n":29,"title":"Tampoco subdimensionen","body":"La selección debe cubrir la carga de diseño con el margen y criterio que correspondan al sistema.","context":"Subdimensionar compromete sostener condiciones de diseño. La reserva debe basarse en criterio técnico.","exercise":"Expongan cómo detectarían falta de capacidad."},{"n":30,"title":"Demostración · Dirección","body":"Ustedes seguirán conmigo la secuencia completa: carga → candidato → tipo → restricciones → validación.","context":"La demostración utiliza Dirección (16 m², 1 persona, Norte). La carga numérica procede de M2.","exercise":"Sigan cada decisión en su matriz, sin inventar BTU/h."},{"n":31,"title":"Paso 1 · recuperar la carga","body":"Usen el resultado validado de M2 y documenten su procedencia.","context":"La carga se obtiene del reporte de M2, distinguiendo total y sensible, unidad y condición de cálculo.","exercise":"Copien ambos resultados y su referencia."},{"n":32,"title":"Paso 2 · capacidad candidata","body":"Identifiquen la clase de capacidad cercana; todavía no la declaren selección final.","context":"La capacidad candidata inicia la búsqueda; todavía no constituye selección definitiva.","exercise":"Marquen la propuesta como PRELIMINAR."},{"n":33,"title":"Paso 3 · unidad interior","body":"Justifiquen el tipo de unidad con base en el espacio, no en preferencia personal.","context":"Definan tipo y ubicación de unidad interior considerando uso, aire, drenaje, ruido y plafón.","exercise":"Redacten dos argumentos verificables."},{"n":34,"title":"Paso 4 · revisar arquitectura","body":"Comprueben plafón, distribución, mantenimiento e interferencias.","context":"La interferencia puede invalidar una opción aun si su capacidad es suficiente.","exercise":"Comprueben acceso de servicio y espacio disponible."},{"n":35,"title":"Paso 5 · validar fabricante","body":"Confirmen capacidades, límites y combinaciones con catálogo/software aplicable.","context":"Consulten desempeño y límites de combinación de la familia seleccionada en Xpress o ficha oficial.","exercise":"Registren qué condiciones quedaron pendientes."},{"n":36,"title":"Checkpoint · Dirección","body":"¿Pueden defender la selección en 60 segundos usando datos?","context":"La defensa breve debe unir dato, equipo, condición de diseño, arquitectura y limitación.","exercise":"Presenten su justificación en 60 segundos."},{"n":37,"title":"Práctica · Recepción","body":"Repitan la secuencia. Atención especial a orientación Oeste y condición de acceso.","context":"Recepción (12 m², 2 personas, Oeste) demanda revisar vidrio y ubicación del usuario.","exercise":"Anoten propuesta y criterio de distribución."},{"n":38,"title":"Práctica · Operativa","body":"Relacionen ocupación, distribución del aire y patrón de uso.","context":"Operativa (20 m², 4 personas, Sur) requiere cuidar alcance, patrón de ocupación y equipamiento.","exercise":"Comprueben que no haya zonas sin cobertura."},{"n":39,"title":"Práctica · Sala de Juntas","body":"Revisen ocupación variable, acústica y distribución.","context":"Sala de Juntas (24 m², 6 personas, Este) combina ocupación, ruido y periodos de uso.","exercise":"Expliquen cómo justificarán confort y acústica."},{"n":40,"title":"Práctica · Archivo/Impresión","body":"No confundan área pequeña con carga despreciable: revisen equipo interno y uso.","context":"Archivo/Impresión (6 m², 1 persona, interior) contiene equipos internos; el área sola no determina la carga.","exercise":"Usen la carga de M2, no W/m² asumidos."},{"n":41,"title":"Error 1","body":"Elegir sólo por BTU/h nominales.","context":"Confundir una clase nominal con capacidad entregada es un error frecuente.","exercise":"Señalen el dato faltante para validar."},{"n":42,"title":"Error 2","body":"Cambiar la carga calculada para hacerla coincidir con un equipo.","context":"Alterar deliberadamente resultados de M2 rompe la trazabilidad y vuelve la selección no auditable.","exercise":"Escriban qué fuente conserva la carga original."},{"n":43,"title":"Error 3","body":"Ignorar acceso de mantenimiento e interferencias.","context":"Si no hay mantenimiento accesible, el diseño no es viable operativamente.","exercise":"Marquen registro o trayectoria de acceso."},{"n":44,"title":"Error 4","body":"Confundir selección preliminar con selección validada.","context":"Una candidata preliminar no sustituye validación con datos del fabricante y condiciones de instalación.","exercise":"Distingan estado preliminar y validado."},{"n":45,"title":"Evaluación formativa","body":"Entreguen una ficha: carga, capacidad candidata, tipo de unidad, 3 criterios de justificación y pendientes.","context":"La ficha permite evaluar razonamiento aun si un programa no funciona en una computadora.","exercise":"Entreguen al menos una ficha técnicamente sustentada."},{"n":46,"title":"Criterio de logro","body":"La selección debe ser trazable, coherente con el espacio y técnicamente argumentada. Meta ≥80%.","context":"La rúbrica valora trazabilidad, carga, selección, arquitectura, compatibilidad y claridad, no sólo modelo elegido.","exercise":"Comprueben los 10 criterios antes de entregar."},{"n":47,"title":"Evidencia","body":"Conserven captura/archivo y anoten qué dato del fabricante falta confirmar.","context":"Guarden fuente de datos, fecha, capturas y advertencias. Una selección debe ser reconstruible.","exercise":"Nombren archivo, versión y responsables."},{"n":48,"title":"Cierre técnico","body":"La pregunta correcta no es «¿qué equipo se parece a mi carga?», sino «¿qué solución satisface y valida esta condición de diseño?»","context":"La mejor respuesta incluye carga validada, desempeño disponible, solución de aire y restricciones comprobadas.","exercise":"Resuman la justificación en dos frases."},{"n":49,"title":"Puente a la siguiente etapa","body":"Con selecciones justificadas podremos estructurar el sistema y llevarlo al flujo de LATS CAD.","context":"La sesión siguiente retoma selecciones preliminares para formar configuración y trazado verificable.","exercise":"Señalen qué queda pendiente de validar."},{"n":50,"title":"Salida 3–2–1","body":"3 criterios que validarás · 2 errores que evitarás · 1 decisión que ya puedes defender.","context":"Tres criterios, dos errores y una decisión defendible: síntesis activa de aprendizajes.","exercise":"Compartan su salida 3–2–1."},{"n":51,"title":"Xpress 10.7.9 · Pantalla principal","body":"Identifiquen Indoor Units, Outdoor Units, Piping, Wiring, Centralized Controllers y Reports. Configuración México; refrigerante y familia de producto se validan con la versión instalada.","context":"Xpress organiza el flujo por etapas. Los nombres de menús pueden variar según versión y base de datos.","exercise":"Identifiquen las seis secciones sin asumir que ya están validadas."},{"n":52,"title":"Antes de seleccionar","body":"En Indoor Units registren nombre de proyecto y cliente, país México, familia aplicable y condiciones de enfriamiento. Usen las cargas reales validadas en M2.","context":"Definan país, unidades, familia y condiciones. No mezclen regiones ni bases de producto.","exercise":"Comprueben México y datos oficiales M2."},{"n":53,"title":"Capacidad total y sensible","body":"La pantalla muestra campos Rq TC y Rq SC (requerimientos total y sensible). Verifiquen unidades y definiciones en la ayuda del programa; no intercambien ambos valores.","context":"Rq TC representa requerimiento total y Rq SC sensible en la pantalla indicada; revisen unidades y documentación de la versión.","exercise":"Registren valores M2 en los campos correctos."},{"n":54,"title":"Unidad interior · primera selección","body":"Agreguen una unidad interior para Dirección. Verifiquen FCU, capacidad, temperatura de evaporación y caudal de aire, conforme a opciones de la versión.","context":"El primer espacio guiado es Dirección. Seleccionen tipo de unidad; revisen datos ofrecidos y advertencias.","exercise":"Anoten modelo candidato y condiciones de selección."},{"n":55,"title":"Unidad exterior · configuración","body":"En Outdoor Units seleccionen familia y configuración compatible. La suma nominal de interiores no sustituye la validación de capacidad corregida y combinación permitida.","context":"La unidad exterior se evalúa con la combinación y carga real; no depende sólo de sumar etiquetas nominales.","exercise":"Revisen capacidad y mensajes de compatibilidad."},{"n":56,"title":"Piping · comprobaciones","body":"En Piping documenten longitudes, ramales, desniveles y advertencias del programa. No inventen distancias del plano: registren como pendiente lo que aún no se midió.","context":"Las distancias del sistema deben medirse en el proyecto. El software no crea geometría verdadera por sí solo.","exercise":"Distingan medido, estimado y pendiente."},{"n":57,"title":"Wiring y controles","body":"Revisen Wiring y Centralized Controllers sólo después de establecer la arquitectura del sistema; la clase no equivale a ingeniería ejecutiva de control.","context":"Interconexiones eléctricas y control son etapas coordinadas con selección mecánica; no sustituyen planos eléctricos.","exercise":"Identifiquen qué revisión corresponde a otra disciplina."},{"n":58,"title":"Reports · evidencia","body":"Generen el reporte de selección disponible, guarden el archivo del proyecto y documenten advertencias o restricciones pendientes.","context":"El reporte es una evidencia de salida, pero las advertencias pendientes deben quedar visibles.","exercise":"Guarden el reporte y escriban dos límites por revisar."},{"n":59,"title":"Práctica guiada · cinco espacios","body":"Completen Recepción, Dirección, Operativa, Sala de Juntas y Archivo/Impresión con sus cargas reales M2, unidad candidata y justificación.","context":"Cada espacio debe mantener carga total/sensible, candidata, restricción, estado y justificación documentados.","exercise":"Completen las cinco filas con datos reales."},{"n":60,"title":"Salida · evidencia verificable","body":"Entreguen matriz por espacio, captura del proyecto, advertencias de validación y explicación de una decisión de selección.","context":"Una entrega auditable incluye matriz, archivo del software o evidencia equivalente y un cierre razonado.","exercise":"Verifiquen integridad del paquete antes de enviar."}];function diagram(n){const svg=(b)=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Esquema técnico didáctico">'+b+'</svg>';const rect=(x,y,w,h,label,color='#dff0f6')=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="12" fill="'+color+'" stroke="#166d9a" stroke-width="2"/><text x="'+(x+w/2)+'" y="'+(y+h/2+5)+'" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b3c5d">'+label+'</text>';const line=(x1,y1,x2,y2,col='#f28c28')=>'<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="'+col+'" stroke-width="6" stroke-linecap="round"/>';let k=n<=10?0:n<=15?1:n<=23?2:n<=29?3:n<=40?4:n<=50?5:6;switch(k){case 0:return svg(rect(14,95,145,100,'CARGA M2')+rect(194,95,130,100,'SELECCIÓN','#fff0df')+rect(357,95,145,100,'VALIDACIÓN')+line(160,146,188,146)+line(326,146,350,146)+'<text x="255" y="63" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b3c5d">RUTA DE INGENIERÍA</text><text x="255" y="246" text-anchor="middle" font-size="16" fill="#476177">Datos verificables · criterio técnico · evidencia</text>');case 1:return svg('<text x="260" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0b3c5d">CARGA TOTAL = SENSIBLE + LATENTE</text>'+rect(35,79,450,44,'Q TOTAL = Q SENSIBLE + Q LATENTE')+rect(35,157,282,73,'Temperatura')+rect(317,157,168,73,'Humedad','#ffe8d1')+'<text x="255" y="274" text-anchor="middle" font-size="15" fill="#476177">Los valores del caso se recuperan de M2</text>');case 2:return svg('<rect x="32" y="45" width="456" height="236" fill="#fff" stroke="#90a6b6" stroke-width="3"/><rect x="52" y="64" width="417" height="26" fill="#e4ecf2"/><text x="258" y="84" text-anchor="middle" font-size="15" fill="#0b3c5d">PLAFÓN · ESPACIO DISPONIBLE</text><rect x="172" y="99" width="176" height="57" rx="9" fill="#8ec9dd" stroke="#166d9a" stroke-width="3"/><text x="260" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b3c5d">UNIDAD INTERIOR</text>'+line(205,161,205,224,'#2a9abb')+line(315,161,315,224,'#2a9abb')+'<path d="M205 224 l-10 -15 m10 15 l10 -15 M315 224 l-10 -15 m10 15 l10 -15" stroke="#2a9abb" stroke-width="4"/><text x="260" y="263" text-anchor="middle" font-size="16" fill="#476177">Aire · drenaje · acceso · acústica</text>');case 3:return svg(rect(20,96,146,112,'UNIDAD EXTERIOR','#ffe7cc')+line(166,150,278,150)+line(278,75,278,233,'#166d9a')+line(278,75,338,75,'#166d9a')+line(278,150,338,150,'#166d9a')+line(278,233,338,233,'#166d9a')+rect(338,41,160,68,'INTERIOR A')+rect(338,119,160,68,'INTERIOR B')+rect(338,207,160,68,'INTERIOR C')+'<text x="260" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b3c5d">COMBINACIÓN Y TUBERÍA: VALIDAR LÍMITES</text>');case 4:return svg('<rect x="55" y="28" width="412" height="237" fill="#f9fcfd" stroke="#166d9a" stroke-width="4"/>'+rect(55,160,122,105,'RECEPCIÓN')+rect(55,98,122,62,'ARCHIVO')+rect(177,28,150,104,'DIRECCIÓN')+rect(177,160,181,105,'OPERATIVA')+rect(358,132,109,133,'JUNTAS')+'<text x="258" y="290" font-size="15" text-anchor="middle" fill="#476177">Esquema de espacios, no plano a escala</text>');case 5:return svg(rect(25,50,470,56,'CARGA VALIDADA')+rect(25,129,219,64,'CANDIDATA')+rect(269,129,226,64,'RESTRICCIONES','#fff0df')+rect(25,221,470,55,'DECISIÓN JUSTIFICADA','#d9f3e5')+line(130,107,130,127)+line(382,108,382,127)+line(130,195,130,220)+line(382,195,382,220));default:return svg('<rect x="23" y="34" width="474" height="232" rx="14" fill="#fff" stroke="#166d9a" stroke-width="3"/><rect x="23" y="34" width="474" height="42" rx="10" fill="#0b3c5d"/><text x="260" y="60" fill="#fff" text-anchor="middle" font-size="17" font-weight="bold">XPRESS · FLUJO DIDÁCTICO</text>'+['Indoor Units','Outdoor Units','Piping','Wiring','Controllers','Reports'].map((t,i)=>rect(42+(i%3)*153,95+Math.floor(i/3)*75,140,55,t,i===0?'#ffe7cc':'#dff0f6')).join(''))}}let idx=0;const el=id=>document.getElementById(id);function paint(){const s=slides[idx];el('kicker').textContent='MÓDULO 3 · SESIÓN 3.2 · APRENDIZAJE Y PRÁCTICA';el('title').textContent=s.title;el('lead').textContent=s.body;el('explain').textContent=s.context;el('task').textContent=s.exercise;el('graphic').innerHTML=diagram(s.n)+'<div class="gcaption">Esquema técnico didáctico · No es una captura del programa ni un diseño ejecutivo</div>';el('number').textContent='Lámina '+(idx+1)+' de '+slides.length;el('counter').textContent=(idx+1)+' / '+slides.length;el('progress').style.width=(100*(idx+1)/slides.length)+'%';window.scrollTo(0,0)}function move(delta){idx=Math.min(slides.length-1,Math.max(0,idx+delta));paint()}el('next').onclick=()=>move(1);el('prev').onclick=()=>move(-1);el('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});paint();</script></body></html>
